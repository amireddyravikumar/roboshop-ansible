- name: Configuring mysql DB
  hosts: mysql
  become: yes
  vars:
    # Replace with your actual plain-text password or an Ansible Vault variable
    new_root_password: "RoboShop@1"
  tasks:
  - name: install mysql server 
    package:
      name: mysql-server
      state: present
  
  - name: Start the service
    service:
      name: "mysqld"
      state: started
      enabled: yes
  - name: setup root password
    command: mysql_secure_installation --set-root-pass RoboShop@1