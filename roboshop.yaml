- name: roboshop instances management
  hosts: local
  connection: local
  vars:
    instances_list: ["mongodb", "redis", "mysql", "rabbitmq"]
    image_id: ami-0220d79f3f480ecf5
    domain_name: amireddyravi.space
    zone_id: Z02709521C0H67BW0WAUD
  tasks:
  - name: create ec2 instances
    amazon.aws.ec2_instance:
      instance_type: t3.micro
      name: "roboshop-{{ item }}"
      image_id: "{{ image_id }}"
      security_groups: 
      - "roboshop-{{ item }}"
      - roboshop-common
    loop: "{{ instances_list }}"
    register: ec2_output

  # - name: print output
  #   debug:
  #     msg: "{{ ec2_output }}"
  # - name: create route 53 record
    # debug:
      # msg: "instance name : {{ item.item }}: private IP: {{ item.instances[0].private_ip_address }} "
      # var: item.instances[0].private_ip_address
    # loop: "{{ ec2_output.results }}"
    # loop_control:
    #   label: "{{ item.item }}"
  - name: create route 53 record
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      type: A
      ttl: 1
      record: "{{ item.item }}.{{ domain_name }}"
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"

  - name: create  frontend route 53 record
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      type: A
      ttl: 1
      record: "{{ item.item }}.{{ domain_name }}"
      value: "{{ item.instances[0].public_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: item.item =="frontend"