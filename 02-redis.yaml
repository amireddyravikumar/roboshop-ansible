- name: Configuring redis DB
  hosts: redis
  become: yes
  tasks:
  - name: install redis 
    package:
      name: redis
      state: present

  - name: Allow the remote connections
    replace:
      path: /etc/redis/redis.conf
      regexp: "127.0.0.1"
      replace: "0.0.0.0"

  - name: replace the protected mode 
    replace:
      path: /etc/redis/redis.conf
      regexp: "protected mode yes"
      replace: "protected mode no"

  - name: Start the service
    service:
      name: "redis"
      state: started
      enabled: yes